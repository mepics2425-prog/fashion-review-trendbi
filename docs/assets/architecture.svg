<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="850" viewBox="0 0 1440 850" role="img" aria-labelledby="title desc">
<title id="title">Fashion Review Trend BI — operational reference and independent demo</title><desc id="desc">Solid blue arrows show data flow. Dashed orange arrows show scheduling control. The operational reference includes collection, validation, MySQL, analytics, API, BI and observability. The independent demo uses synthetic CSV, tested Python, JSON and a static dashboard.</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 8 4 0 8" fill="none" stroke="#315deb" stroke-width="1.5"/></marker><marker id="control" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 8 4 0 8" fill="none" stroke="#ab782c" stroke-width="1.5"/></marker><style>text{font-family:Arial,'Malgun Gothic',sans-serif;fill:#253044}.kicker{font-size:12px;letter-spacing:2px;fill:#69768a}.title{font-size:32px;font-weight:700}.label{font-size:15px;font-weight:700}.body{font-size:13px;fill:#68758a}.tiny{font-size:11px;fill:#69768a}.box{fill:#fff;stroke:#dbe2ee}.data{fill:none;stroke:#315deb;stroke-width:2;marker-end:url(#arrow)}.control{fill:none;stroke:#ab782c;stroke-width:2;stroke-dasharray:6 5;marker-end:url(#control)}</style></defs>
<rect width="1440" height="850" rx="14" fill="#f7f8fb"/>
<text x="42" y="43" class="kicker">FASHION REVIEW / ENGINEERING MAP</text><text x="42" y="87" class="title">From collection to interpretable signals.</text>
<path d="M1030 40h42" class="data"/><text x="1086" y="45" class="tiny">DATA FLOW</text><path d="M1210 40h42" class="control"/><text x="1265" y="45" class="tiny">CONTROL</text>
<rect x="26" y="116" width="1388" height="470" rx="12" fill="#eef2f8" stroke="#dce3ee"/>
<text x="48" y="150" class="label">01 / OPERATIONAL REFERENCE</text><text x="48" y="174" class="body">Architecture based on work experience. Production code, data and infrastructure are not included.</text>
<rect x="48" y="230" width="200" height="128" rx="8" class="box"/><text x="65" y="255" class="kicker">DATA SOURCE</text><text x="65" y="286" class="label">Fashion products</text><text x="65" y="312" class="body">Musinsa review signals</text><text x="65" y="334" class="tiny">29CM scope is separate</text>
<rect x="288" y="230" width="205" height="128" rx="8" class="box"/><text x="306" y="255" class="kicker">COLLECTION</text><text x="306" y="286" class="label">Python / Playwright</text><text x="306" y="312" class="body">Page data + JSON-LD</text><text x="306" y="334" class="tiny">Product identity before values</text>
<rect x="533" y="230" width="215" height="128" rx="8" class="box"/><text x="551" y="255" class="kicker">PROCESSING</text><text x="551" y="286" class="label">Validate / Normalize</text><text x="551" y="312" class="body">Deduplicate / missing ≠ 0</text><text x="551" y="334" class="tiny">Ambiguous values rejected</text>
<rect x="788" y="214" width="250" height="162" rx="8" fill="#e9efff" stroke="#b9cafa"/><text x="806" y="240" class="kicker">STORAGE / MYSQL</text><path d="M806 251h214" stroke="#c5d3f5"/><text x="806" y="277" class="label">Products</text><text x="806" y="298" class="body">Identity + category + metadata</text><path d="M806 310h214" stroke="#c5d3f5"/><text x="806" y="335" class="label">Observation snapshots</text><text x="806" y="356" class="body">Product × observed_at × count</text>
<rect x="1078" y="230" width="310" height="128" rx="8" class="box"/><text x="1096" y="255" class="kicker">ANALYTICS</text><text x="1096" y="286" class="label">Trend + observation quality</text><text x="1096" y="312" class="body">Delta / elapsed-time rate / coverage</text><text x="1096" y="334" class="tiny">KST dates + span + recency</text>
<path d="M248 294h40" class="data"/><path d="M493 294h40" class="data"/><path d="M748 294h40" class="data"/><path d="M1038 294h40" class="data"/>
<rect x="48" y="421" width="445" height="116" rx="8" fill="#fcf7ee" stroke="#e4d3b8"/><text x="65" y="447" class="kicker">SCHEDULING / SYSTEMD</text><text x="65" y="475" class="label">09:00 keyword rotation · 13:00 re-observation</text><text x="65" y="501" class="body">Up to 20 products / day · 5 per category</text><text x="65" y="521" class="tiny">Observation depth / staleness / retry deferral / no duplicates</text>
<path d="M390 421v-63" class="control"/><text x="402" y="397" class="tiny">TRIGGER</text>
<rect x="533" y="421" width="505" height="116" rx="8" class="box"/><text x="551" y="447" class="kicker">OBSERVABILITY</text><text x="551" y="477" class="label">Execution logs / success rates / failure taxonomy</text><text x="551" y="504" class="body">Run history + extraction errors inform operations</text>
<path d="M640 358v63" class="data"/><text x="653" y="396" class="tiny">RUN EVENTS</text>
<rect x="1078" y="421" width="133" height="116" rx="8" class="box"/><text x="1094" y="447" class="kicker">SERVING</text><text x="1094" y="476" class="label">Python API</text><text x="1094" y="501" class="tiny">HTTP / JSON</text>
<rect x="1251" y="421" width="137" height="116" rx="8" class="box"/><text x="1266" y="447" class="kicker">VISUALIZATION</text><text x="1266" y="476" class="label">LIVE BI</text><text x="1266" y="501" class="tiny">HTML / CSS / JS</text>
<path d="M1144 358v63" class="data"/><path d="M1211 479h40" class="data"/><path d="M1038 479h40" class="data"/>
<text x="48" y="567" class="tiny">Operational improvement: priority rules tested and configured; first scheduled-run impact remains unverified.</text>
<rect x="26" y="610" width="1388" height="214" rx="12" fill="#fff" stroke="#dce3ee"/>
<text x="48" y="645" class="label">02 / INDEPENDENT PUBLIC DEMO</text><text x="48" y="671" class="body">No live scraping, database, API server or systemd required. All products and runs are synthetic.</text>
<rect x="48" y="699" width="270" height="85" rx="7" fill="#f6f8fc" stroke="#e0e5ef"/><text x="66" y="729" class="label">Synthetic CSV + fictional runs</text><text x="66" y="754" class="body">Deterministic fixture generation</text>
<rect x="368" y="699" width="285" height="85" rx="7" fill="#f6f8fc" stroke="#e0e5ef"/><text x="386" y="729" class="label">Tested Python pipeline</text><text x="386" y="754" class="body">Normalize → trend → quality</text>
<rect x="703" y="699" width="270" height="85" rx="7" fill="#edf2ff" stroke="#c6d4fa"/><text x="721" y="729" class="label">docs/data/demo.json</text><text x="721" y="754" class="body">Versioned static data contract</text>
<rect x="1023" y="699" width="365" height="85" rx="7" fill="#f6f8fc" stroke="#e0e5ef"/><text x="1041" y="729" class="label">Static BI / GitHub Pages compatible</text><text x="1041" y="754" class="body">Period + category + search + product history</text>
<path d="M318 741h50" class="data"/><path d="M653 741h50" class="data"/><path d="M973 741h50" class="data"/>
</svg>
